name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # `flutter analyze` also analyzes the example app.
      - run: flutter pub get
        working-directory: example
      - run: flutter analyze
      - run: flutter test
